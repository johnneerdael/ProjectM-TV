name: Android CI

# Every push / pull request: native tests + a release APK and core AAR as downloadable artifacts.
# Push to main with a new versionName (app/build.gradle): also creates tag v<versionName> and a
# GitHub Release with the APK, the core AAR and the top section of RELEASE_NOTES.md.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native-tests:
    name: Native engine tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive  # projectM is built from source (third_party/projectm)
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'  # same major as F-Droid's build server (OpenJDK 21), for reproducible builds
      - name: Check the preset index (names and memory weights) is up to date
        run: tools/gen-preset-index.py --check
      - name: Check presets (audio-reactive, no excluded or missing textures)
        run: tools/check-presets.py
      - name: Verify measured category membership, weights and provenance
        run: python3 tools/import-preset-genres.py --bundle core/src/main/assets/preset-genres --check
      - name: Install Mesa (headless OpenGL ES 3 for the transition overlay test)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libegl-dev libgles-dev libegl-mesa0 libgl1-mesa-dri pkg-config > /dev/null
      - name: Run host tests (ASan/UBSan)
        run: core/src/test/native/run_native_tests.sh

  apk:
    name: Build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      release: ${{ steps.version.outputs.release }}
      apk_name: ${{ steps.apk.outputs.name }}
      aar_name: ${{ steps.aar.outputs.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive  # projectM is built from source (third_party/projectm)

      - name: Determine version
        id: version
        run: |
          VERSION=$(sed -nE 's/.*versionName "([^"]+)".*/\1/p' app/build.gradle | head -n1)
          TAG="v${VERSION}"
          RELEASE=false
          SUFFIX="-ci.${GITHUB_RUN_NUMBER}"
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF}" = "refs/heads/main" ] \
             && ! git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null; then
            RELEASE=true
            SUFFIX=""
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "release=${RELEASE}" >> "$GITHUB_OUTPUT"
          echo "VERSION_SUFFIX=${SUFFIX}" >> "$GITHUB_ENV"
          echo "Version ${VERSION}${SUFFIX} (release: ${RELEASE})"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'  # same major as F-Droid's build server (OpenJDK 21), for reproducible builds

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare Android SDK
        run: |
          # The committed local.properties points at a developer machine.
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install \
            "cmake;3.22.1" "ndk;27.3.13750724" "platforms;android-34" > /dev/null

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${KEYSTORE_BASE64}" ]; then
            echo "${KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/release.jks"
            echo "SIGNING_KEYSTORE_PATH=${RUNNER_TEMP}/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::SIGNING_KEYSTORE_BASE64 is not set; APK is signed with a temporary debug key (see docs/RELEASING.md)."
          fi

      - name: JVM unit tests
        run: ./gradlew testReleaseUnitTest --no-daemon

      - name: Build release APK and core AAR
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Name APK
        id: apk
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          if [ "${{ steps.version.outputs.release }}" = "true" ]; then
            NAME="projectM-TV-${{ steps.version.outputs.version }}.apk"
          else
            NAME="projectM-TV-${{ steps.version.outputs.version }}-ci.${GITHUB_RUN_NUMBER}-${SHORT_SHA}.apk"
          fi
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/${NAME}"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          ls -lh dist

      - name: Name core AAR
        id: aar
        run: |
          # The root assembleRelease also builds :core (the engine library the app embeds).
          SHORT_SHA=$(git rev-parse --short HEAD)
          if [ "${{ steps.version.outputs.release }}" = "true" ]; then
            NAME="projectM-TV-core-${{ steps.version.outputs.version }}.aar"
          else
            NAME="projectM-TV-core-${{ steps.version.outputs.version }}-ci.${GITHUB_RUN_NUMBER}-${SHORT_SHA}.aar"
          fi
          mkdir -p dist-aar
          cp core/build/outputs/aar/core-release.aar "dist-aar/${NAME}"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          ls -lh dist-aar

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/*.apk
          retention-days: 30
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: core-aar
          path: dist-aar/*.aar
          retention-days: 30
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [native-tests, apk]
    if: needs.apk.outputs.release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: core-aar
          path: dist

      - name: Extract release notes
        run: |
          # Top section of RELEASE_NOTES.md, up to the first '---' separator.
          awk '/^---[[:space:]]*$/ {exit} {print}' RELEASE_NOTES.md > notes.md
          [ -s notes.md ] || echo "Release ${{ needs.apk.outputs.tag }}" > notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Also attach the APK under a fixed name, so this link always serves the newest stable
          # release: https://github.com/<owner>/<repo>/releases/latest/download/projectM-TV.apk
          # (and projectM-TV-core.aar for the core library).
          cp "dist/${{ needs.apk.outputs.apk_name }}" dist/projectM-TV.apk
          cp "dist/${{ needs.apk.outputs.aar_name }}" dist/projectM-TV-core.aar
          gh release create "${{ needs.apk.outputs.tag }}" \
            "dist/${{ needs.apk.outputs.apk_name }}" dist/projectM-TV.apk \
            "dist/${{ needs.apk.outputs.aar_name }}" dist/projectM-TV-core.aar \
            --target "${GITHUB_SHA}" \
            --title "ProjectM TV ${{ needs.apk.outputs.version }}" \
            --notes-file notes.md \
            --latest

  milkbeat:
    name: Rebuild Milkbeat with this core
    needs: [apk, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Trigger Milkbeat's build
        env:
          # Fine-grained token for johnneerdael/Milkbeat with Contents read/write (repository_dispatch).
          GH_TOKEN: ${{ secrets.MILKBEAT_TOKEN }}
          VERSION: ${{ needs.apk.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::warning::MILKBEAT_TOKEN is not set; Milkbeat was not rebuilt (see docs/RELEASING.md)."
            exit 0
          fi
          # Milkbeat follows the newest stable core, so a rebuild of its main branch is all it needs.
          gh api repos/johnneerdael/Milkbeat/dispatches \
            -f event_type=projectm-core-release -f "client_payload[version]=${VERSION}"
          echo "Triggered Milkbeat's build for core ${VERSION}."
