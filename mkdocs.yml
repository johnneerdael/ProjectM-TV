site_name: ProjectM TV user guide
site_description: Music visualization, remote controls and measured Dance presets for Android TV.
site_url: https://johnneerdael.github.io/ProjectM-TV/
repo_url: https://github.com/johnneerdael/ProjectM-TV
edit_uri: blob/main/docs/user-guide/
docs_dir: docs/user-guide
site_dir: build/user-guide-site
theme:
  name: readthedocs
  highlightjs: false
  navigation_depth: 2
extra_css:
  - stylesheets/projectm.css
plugins:
  - search
markdown_extensions:
  - tables
  - toc:
      permalink: true
nav:
  - User guide: index.md
  - Install and get started: getting-started.md
  - Remote controls: controls.md
  - Settings reference: settings.md
  - Dance collection: dance.md
  - Troubleshooting: troubleshooting.md
  - Technical details:
      - How Dance is measured: dance-measurement.md
      - Build and test: development.md
validation:
  links:
    not_found: warn
    anchors: warn
