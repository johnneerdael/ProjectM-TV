apply plugin: 'com.android.application'

def audienceReview = providers.gradleProperty('audienceReview').orElse('false').get().toBoolean()
def reviewAar = file(providers.gradleProperty('audienceReviewAar').orElse('../build/core-audience-analysis/published/projectM-TV-core-2.2.4.aar').get())
def reviewAssets = file(providers.gradleProperty('audienceReviewAssets').orElse('../build/core-audience-review-assets').get())
if (audienceReview && gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') || it.toLowerCase().contains('profile') }) {
    throw new GradleException('Audience review is a Debug-only build')
}
if (audienceReview && !reviewAar.isFile()) throw new GradleException('Pinned published audience-review AAR is missing')

// Floors for this release line. CI derives each patch/code from first-parent main history.
// Reset all three only for a planned new release line; routine PRs need no version bump.
def baseVersionName = "2.2.0"
def baseVersionCode = 38
def baseVersionCommit = "da4fe0edf20ed1590b740e5a1af34956a80b0c20"

android {
    // Java package of the code; the installed app ID (applicationId below) is separate since 1.9.7.
    namespace "com.example.projectm.visualizer"
    compileSdkVersion 34
    // Pinned so local and CI builds use the same toolchain (preinstalled on GitHub's Ubuntu runners);
    // the app strips the engine's native library with it.
    ndkVersion "27.3.13750724"
    defaultConfig {
        buildConfigField 'boolean', 'AUDIENCE_REVIEW', 'false'
        applicationId "nl.neerdael.projectmtv"
        minSdkVersion 21
        targetSdkVersion 34
        testInstrumentationRunner "com.example.projectm.visualizer.MusicCategoryInstrumentation"
        versionCode = (System.getenv("PROJECTM_RELEASE_VERSION_CODE") ?: baseVersionCode.toString()).toInteger()
        versionName = (System.getenv("PROJECTM_RELEASE_VERSION") ?: baseVersionName) + (System.getenv("VERSION_SUFFIX") ?: "")
    }
    signingConfigs {
        release {
            // Provided by CI (GitHub secrets) or your shell; see docs/RELEASING.md.
            def keystore = System.getenv("SIGNING_KEYSTORE_PATH")
            if (keystore) {
                storeFile file(keystore)
                storePassword System.getenv("SIGNING_STORE_PASSWORD")
                keyAlias System.getenv("SIGNING_KEY_ALIAS")
                keyPassword System.getenv("SIGNING_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        debug {
            if (audienceReview) {
                buildConfigField 'boolean', 'AUDIENCE_REVIEW', 'true'
                applicationIdSuffix '.audiencereview'
                versionNameSuffix '-audience-review'
                resValue 'string', 'app_name', 'ProjectM TV · Audience review'
            } else if (project.hasProperty('presetLabDeviceTest') || project.hasProperty('setupScreenshotTest')) {
                def setupTest = project.hasProperty('setupScreenshotTest')
                applicationIdSuffix setupTest ? ".setuptest" : ".presettest"
                versionNameSuffix setupTest ? "-setuptest" : "-presettest"
                resValue "string", "app_name", setupTest ? "ProjectM TV · Setup test" : "ProjectM TV · Preset test"
            }
        }
        release {
            // R8 shrinks, optimizes and obfuscates; retrace crash traces with the release's mapping.txt.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Use the release key when configured, otherwise the local debug key, so
            // `./gradlew assembleRelease` always produces an installable, non-debuggable APK.
            signingConfig System.getenv("SIGNING_KEYSTORE_PATH") ? signingConfigs.release : signingConfigs.debug
        }
        // Release code, profileable by simpleperf (src/profile/AndroidManifest.xml), installed next
        // to the real app: `./gradlew assembleProfile`, see docs/PROFILING.md.
        profile {
            initWith release
            signingConfig signingConfigs.debug
            applicationIdSuffix ".profile"
            matchingFallbacks = ['release']
        }
    }
    testOptions {
        // android.util.Log etc. return defaults in JVM unit tests
        unitTests.returnDefaultValues = true
    }
    buildFeatures { buildConfig true }
    if (audienceReview) sourceSets.debug.assets.srcDir reviewAssets
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    // No encrypted dependency list in the APK signing block: only Google Play can read it, and
    // F-Droid's scanner rejects APKs that carry it.
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }
}

dependencies {
    if (audienceReview) implementation files(reviewAar)
    else implementation project(':core')
    // No AndroidX dependencies: the app only uses framework APIs, which keeps the APK small
    // and cold start fast on low-end TV boxes.
    testImplementation 'junit:junit:4.13.2'
}

if (audienceReview) {
    def validateReview = tasks.register('validateAudienceReviewAssets') {
        doLast {
            def manifestFile = new File(reviewAssets,'audience-review.json')
            if (!manifestFile.isFile()) throw new GradleException('Complete audience score export is required before building the review APK')
            def manifest = new groovy.json.JsonSlurper().parse(manifestFile)
            if (manifest.unscored != 0 || manifest.scored != manifest.corpus_count || manifest.presets.size() != manifest.corpus_count)
                throw new GradleException('Audience review requires a score for every corpus preset')
            def sha = { File f -> java.security.MessageDigest.getInstance('SHA-256').digest(f.bytes).encodeHex().toString() }
            if (sha(reviewAar) != manifest.run_metadata.aar_sha256) throw new GradleException('Review AAR differs from scoring AAR')
            manifest.checksums.each { path, expected ->
                def artifact = new File(reviewAssets,path)
                if (!artifact.isFile() || sha(artifact) != expected) throw new GradleException('Audience asset checksum differs: '+path)
            }
        }
    }
    tasks.matching { it.name == 'mergeDebugAssets' }.configureEach { dependsOn validateReview }
}
