apply plugin: 'com.android.application'

android {
    namespace "com.example.projectm.visualizer"
    compileSdkVersion 34
    defaultConfig {
        applicationId "com.example.projectm.visualizer"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 8
        versionName "1.8"
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
            }
        }
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            // Sideload-friendly: sign release builds with the local debug key so
            // `./gradlew assembleRelease` produces an installable, non-debuggable (faster) APK.
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
}

dependencies {
    // No AndroidX dependencies: the app only uses framework APIs, which keeps the APK small
    // and cold start fast on low-end TV boxes.
}
