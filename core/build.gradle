def renderingPolicy = providers.gradleProperty('projectmCoreRenderingPolicy').getOrElse('native')
if (renderingPolicy == 'capped') {
    throw new GradleException("The capped core artifact is retired. Build :core without projectmCoreRenderingPolicy or with -PprojectmCoreRenderingPolicy=native.")
}
if (renderingPolicy != 'native') {
    throw new GradleException("projectmCoreRenderingPolicy must be 'native' (got '${renderingPolicy}')")
}

apply plugin: 'com.android.library'

android {
    namespace = "nl.neerdael.projectm.core"
    compileSdk = 34
    ndkVersion = "27.3.13750724"
    buildFeatures {
        buildConfig = true
    }
    defaultConfig {
        minSdk = 21
        consumerProguardFiles "consumer-rules.pro"
        buildConfigField 'String', 'RENDERING_POLICY', '"' + renderingPolicy + '"'
        buildConfigField 'boolean', 'SUPPORTS_NATIVE_RENDERING', 'true'
        externalNativeBuild {
            cmake {
                arguments "-DPROJECTMTV_RENDERING_POLICY=${renderingPolicy}"
                cppFlags "-std=c++17"
            }
        }
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
    }
    testOptions {
        // android.util.Log etc. return defaults in JVM unit tests
        unitTests.returnDefaultValues = true
        unitTests.all {
            systemProperty 'projectmCoreRenderingPolicy', renderingPolicy
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version = "3.22.1"
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
